<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quét QR bàn</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#fff;
      color:#1f1f1f;
      max-width:480px;
      margin:auto;
      padding:16px;
    }
    .title{
      font-size:22px;
      font-weight:800;
      margin-bottom:8px;
    }
    .sub{
      color:#666;
      font-size:14px;
      line-height:1.5;
      margin-bottom:14px;
    }
    #qrReader{
      width:100%;
      min-height:300px;
      border-radius:16px;
      overflow:hidden;
      background:#000;
    }
    .btn{
      width:100%;
      margin-top:14px;
      border:none;
      border-radius:14px;
      padding:15px;
      font-size:17px;
      font-weight:700;
      background:#e53935;
      color:#fff;
    }
    .status{
      margin-top:12px;
      color:#777;
      font-size:13px;
      text-align:center;
      line-height:1.5;
    }
  </style>
</head>
<body>
  <div class="title">📷 Quét QR bàn</div>
  <div class="sub">Hướng camera vào mã QR trên bàn để vào phiên gọi món hiện tại.</div>

  <div id="qrReader"></div>
  <div id="status" class="status">Bấm “Bắt đầu quét” để mở camera.</div>

<button class="btn" onclick="startScan()">Bắt đầu quét QR</button>
<button class="btn" style="background:#f3f3f3;color:#333" onclick="goBack()">Quay lại</button>

  <script>
    let scanner = null;
let scanned = false;
let starting = false;

    function goBack(){
  const homeUrl = "https://rangshinhp.github.io/order/";

  try{
    if (scanner && scanner.isScanning) {
      scanner.stop()
        .then(function(){
          window.location.href = homeUrl;
        })
        .catch(function(){
          window.location.href = homeUrl;
        });
    } else {
      window.location.href = homeUrl;
    }
  }catch(e){
    window.location.href = homeUrl;
  }
}

    function startScan(){
      const status = document.getElementById("status");
      if (starting) return;
starting = true;

      if (typeof Html5Qrcode === "undefined"){
  starting = false;
  status.textContent = "Không tải được bộ quét QR. Vui lòng thử lại.";
  return;
}

      scanner = new Html5Qrcode("qrReader");

      scanner.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: { width: 240, height: 240 }
        },
        function(decodedText){
          if (scanned) return;
          scanned = true;

          const text = String(decodedText || "").trim();

          status.textContent = "Đã quét được QR, đang mở phiên bàn...";

          scanner.stop().finally(function(){
            if (/^https?:\/\//i.test(text)) {
              window.location.href = text;
            } else {
              status.textContent = "QR không phải link phiên bàn.";
              scanned = false;
            }
          });
        },
        function(){}
      ).then(function(){
        status.textContent = "Đưa QR vào giữa khung hình.";
      }).catch(function(err){
        starting = false;
        status.innerHTML = "Không mở được camera.<br>Hãy kiểm tra quyền camera trong Safari/Chrome.";
      });
    }

  </script>
</body>
</html>
